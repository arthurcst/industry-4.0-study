services:
    mosquitto:
        image: eclipse-mosquitto:2.0
        container_name: mosquitto
        restart: always
        ports:
            - "1883:1883"
            - "9001:9001"
        volumes:
            - mosquitto_data:/mosquitto/data
            - ./mosquitto/mosquitto_config:/mosquitto/config
            - mosquitto_log:/mosquitto/log

    postgres:
        image: postgres:14
        container_name: postgres
        restart: always
        environment:
            POSTGRES_USER: grafana
            POSTGRES_PASSWORD: grafana
            POSTGRES_DB: iot_batch
        ports:
            - "5434:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    influxdb:
        image: influxdb:2.7
        container_name: influxdb
        restart: always
        ports:
            - "8086:8086"
        environment:
            - DOCKER_INFLUXDB_INIT_MODE=setup
            - DOCKER_INFLUXDB_INIT_USERNAME=admin
            - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
            - DOCKER_INFLUXDB_INIT_ORG=my-org
            - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-iot_stream_1x}
            - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-token
        volumes:
            - influxdb_data:/var/lib/influxdb2

    grafana:
        image: grafana/grafana:10.4.5
        container_name: grafana
        restart: always
        depends_on:
            - postgres
            - influxdb
        ports:
            - "3000:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_USERS_ALLOW_SIGN_UP=false
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning
            - ./grafana/dashboards:/var/lib/grafana/dashboards

    batch-consumer:
        build:
            context: .
            dockerfile: Dockerfile.batch
        container_name: batch_consumer
        environment:
            - PYTHONUNBUFFERED=1
        volumes:
            - ${BATCH_OUTPUT_HOST:-./batches_output_1x}:/app/batches_output
            - ${BATCH_PROCESSED_HOST:-./batches_processed_1x}:/app/batches_processed
        env_file:
            - docker.env
        depends_on:
            - mosquitto
            - postgres

    stream-consumer:
        build:
            context: .
            dockerfile: Dockerfile.stream
        container_name: stream_consumer
        environment:
            - PYTHONUNBUFFERED=1
        env_file:
            - docker.env
        depends_on:
            - mosquitto
            - influxdb

    sensor-generator:
        build:
            context: .
            dockerfile: Dockerfile.generator
        container_name: sensor_generator
        restart: "no"
        env_file:
            - docker.env
        depends_on:
            - batch-consumer
            - stream-consumer

volumes:
    postgres_data:
    influxdb_data:
    grafana_data:
    mosquitto_data:
    mosquitto_log:
