apiVersion: 1

datasources:
  - name: InfluxDB-Stream
    uid: influx-stream
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: true
    jsonData:
      version: Flux
      organization: my-org
      defaultBucket: iot_stream_1x
      tlsSkipVerify: true
    secureJsonData:
      token: my-super-token

  - name: PostgreSQL-Batch
    uid: postgres-batch
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana
    editable: true
    jsonData:
      database: iot_batch
      sslmode: disable
      postgresVersion: 1400
      timescaledb: false
    secureJsonData:
      password: grafana
